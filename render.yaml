services:
  - type: web
    name: stitch-stock-backend
    runtime: docker
    plan: free # Can be 'standard' etc.
    envVars:
      - key: GOOGLE_SHEETS_ID
        sync: false # Set manually in Render dashboard
      - key: FIREBASE_SERVICE_ACCOUNT_B64
        sync: false # Set manually in Render dashboard
      - key: PORT
        value: 8000
    rootDirectory: .
    dockerfilePath: Dockerfile
